[tasks."skills:install"]
description = "Show how to install skills (choose a provider explicitly; no default fan-out)"
run = """
echo 'Choose a provider explicitly (no default, by design):'
echo '  mise run skills:install:copilot   # GitHub Copilot (Copilot-only machines)'
echo '  mise run skills:install:codex     # Codex + custom agents'
echo '  mise run skills:install:claude    # Claude'
echo '  mise run skills:install:opencode  # OpenCode + custom agents'
echo '  mise run skills:install:all       # every provider (deliberate opt-in)'
"""

[tasks."skills:install:all"]
description = "Install this repo's skills globally for EVERY provider (deliberate opt-in); also installs custom agents"
run = "./install-global-skills.sh --provider all"

[tasks."skills:install:codex"]
description = "Install this repo's skills and custom agents globally for Codex"
run = "./install-global-skills.sh --provider codex"

[tasks."skills:install:copilot"]
description = "Install this repo's skills globally for GitHub Copilot"
run = "./install-global-skills.sh --provider copilot"

[tasks."skills:install:claude"]
description = "Install this repo's skills globally for Claude"
run = "./install-global-skills.sh --provider claude"

[tasks."skills:install:opencode"]
description = "Install this repo's skills and custom agents globally for OpenCode"
run = "./install-global-skills.sh --provider opencode"

[tasks."project:install:codex"]
description = "Install or refresh Codex-native project rules into a target repo"
run = "./install-provider-rules.sh --provider codex --force"

[tasks."project:install:copilot"]
description = "Install or refresh Copilot-native project rules into a target repo"
run = "./install-provider-rules.sh --provider copilot --force"

[tasks."project:install:claude"]
description = "Install or refresh Claude-native project rules into a target repo"
run = "./install-provider-rules.sh --provider claude --force"

[tasks."project:install:all"]
description = "Install or refresh Codex, Copilot, and Claude project rules into a target repo"
run = "./install-provider-rules.sh --provider all --force"
