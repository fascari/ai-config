[tasks."skills:install"]
description = "Install this repo's skills globally for Codex, Copilot, and Claude"
run = "./install-global-skills.sh"

[tasks."skills:install:all"]
description = "Install this repo's skills globally for Codex, Copilot, and Claude"
run = "./install-global-skills.sh"

[tasks."skills:install:codex"]
description = "Install this repo's skills globally for Codex"
run = "./install-global-skills.sh --provider codex"

[tasks."skills:install:copilot"]
description = "Install this repo's skills globally for GitHub Copilot"
run = "./install-global-skills.sh --provider copilot"

[tasks."skills:install:claude"]
description = "Install this repo's skills globally for Claude"
run = "./install-global-skills.sh --provider claude"

[tasks."project:install:codex"]
description = "Install Codex-native project rules into a target repo"
run = "./install-provider-rules.sh --provider codex"

[tasks."project:install:copilot"]
description = "Install Copilot-native project rules into a target repo"
run = "./install-provider-rules.sh --provider copilot"

[tasks."project:install:claude"]
description = "Install Claude-native project rules into a target repo"
run = "./install-provider-rules.sh --provider claude"

[tasks."project:install:all"]
description = "Install Codex, Copilot, and Claude project rules into a target repo"
run = "./install-provider-rules.sh --provider all"
